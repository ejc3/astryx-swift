# The iPhone and iPad app's Xcode project is generated from this file (`xcodegen generate`)
# and is not committed. CocoaPods then adds React Native to it (`pod install`).
name: AstryxSwift
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    # No team: a simulator build needs none. A TestFlight archive is signed by the team,
    # given on the command line (scripts/testflight.sh).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # The build phases run Node on files outside the project directory.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  AstryxKit:
    path: ../AstryxKit
targets:
  AstryxSwift:
    type: application
    platform: iOS
    sources:
      # Host is the runtime, the native module and the web view, shared with the Mac app.
      - path: ../Host
        group: Host
      - App
    dependencies:
      - package: AstryxKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ejc3.astryxswift
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Astryx Swift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No encryption beyond what the OS provides: no export-compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: ../Host/AXClient-Bridging-Header.h
    postCompileScripts:
      - name: Bundle the core and the web page
        basedOnDependencyAnalysis: false
        script: |
          set -e
          . "$SRCROOT/.xcode.env"
          if [ -f "$SRCROOT/.xcode.env.local" ]; then . "$SRCROOT/.xcode.env.local"; fi
          "$NODE_BINARY" "$SRCROOT/../../scripts/bundle.mjs" --platform=ios "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/main.jsbundle"
          "$SRCROOT/../../scripts/copy-web.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
